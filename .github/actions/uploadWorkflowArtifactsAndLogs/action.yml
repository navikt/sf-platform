name: "Upload workflow artifacts and logs"
description: "Uploads logs and sfp generated artifacts to the workflow"
inputs:
  artifactName:
    description: "Name of the artifact"
    required: true
  uploadArtifacts:
    description: "If true upload the artifacts"
    required: true
  logName:
    description: "Name of the logs"
    required: true
  publishLogs:
    description: "If true upload the flxbl logs"
    required: true
runs:
  using: composite
  steps:
    - name: "Publish artifacts"
      if: ${{ inputs.uploadArtifacts }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifactName }}
        path: artifacts
        retention-days: 10

      # Upload Flxbl logs
    - name: "Publish logs"
      if: ${{ inputs.publishLogs }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: "${{ inputs.logName }}"
        path: .sfpowerscripts
        if-no-files-found: ignore
        retention-days: 1
